<!DOCTYPE html>
<html lang="id">
<head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <title>Class of 2026</title>
    <style>
        body { font-family: "Roboto", sans-serif; }
    </style>
</head>

<body class="flex flex-col items-center min-h-screen justify-center bg-slate-300">

    <nav class="fixed top-0 left-0 w-full px-4 py-3 z-10">
        <a href="index.html" class="inline-flex items-center gap-1.5 text-[12px] text-slate-500 hover:text-blue-400 transition font-medium">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
            Kembali
        </a>
    </nav>

    <div id="loading" class="text-white/40 text-sm tracking-widest">Loading...</div>

    <div id="profileContent" class="hidden relative w-[300px] h-auto bg-white rounded-lg">

        <div class="flex justify-between items-center px-4 py-3">
            <div class="flex gap-4">
                <div class="w-13 h-13 rounded-full overflow-hidden shrink-0">
                    <img id="profilePhoto" class="w-full object-cover" src="" alt="Foto">
                </div>
                <div class="flex flex-col justify-center">
                    <p class="font-bold" id="profileName"></p>
                    <p id="profileNim"></p>
                    <p id="profileDept" class="hidden"></p>
                    <p id="infoId" class="hidden"></p>
                </div>
            </div>
            <div>
                <svg aria-label="More options" fill="currentColor" height="24" role="img" viewBox="0 0 24 24" width="24"><title>More options</title><circle cx="12" cy="12" r="1.5"></circle><circle cx="6" cy="12" r="1.5"></circle><circle cx="18" cy="12" r="1.5"></circle></svg>
            </div>
        </div>

        <div>
            <img id="profilePhotoMain" class="w-full object-cover" src="" alt="Foto">
        </div>

        <div class="px-4 py-3 flex justify-between">
            <div class="flex gap-3">
                <svg aria-label="Like" fill="#ed4956" height="24" role="img" viewBox="0 0 48 48" width="24"><title>Unlike</title><path d="M34.6 3.1c-4.5 0-7.9 1.8-10.6 5.6-2.7-3.7-6.1-5.5-10.6-5.5C6 3.1 0 9.6 0 17.6c0 7.3 5.4 12 10.6 16.5.6.5 1.3 1.1 1.9 1.7l2.3 2c4.4 3.9 6.6 5.9 7.6 6.5.5.3 1.1.5 1.6.5s1.1-.2 1.6-.5c1-.6 2.8-2.2 7.8-6.8l2-1.8c.7-.6 1.3-1.2 2-1.7C42.7 29.6 48 25 48 17.6c0-8-6-14.5-13.4-14.5z"></path></svg>
                <svg aria-label="Comment" fill="currentColor" height="24" role="img" viewBox="0 0 24 24" width="24"><title>Comment</title><path d="M20.656 17.008a9.993 9.993 0 1 0-3.59 3.615L22 22Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="2"></path></svg>
                <svg aria-label="Share" fill="currentColor" height="24" role="img" viewBox="0 0 24 24" width="24"><title>Share</title><line fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="2" x1="22" x2="9.218" y1="3" y2="10.083"></line><polygon fill="none" points="11.698 20.334 22 3.001 2 3.001 9.218 10.084 11.698 20.334" stroke="currentColor" stroke-linejoin="round" stroke-width="2"></polygon></svg>
            </div>
            <div>
                <svg aria-label="Remove" fill="currentColor" height="24" role="img" viewBox="0 0 24 24" width="24"><title>Remove</title><path d="M20 22a.999.999 0 0 1-.687-.273L12 14.815l-7.313 6.912A1 1 0 0 1 3 21V3a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1Z"></path></svg>
            </div>
        </div>

        <div class="flex pb-4">
            <p class="px-3"><strong class="pr-2" id="profileNameCaption"></strong><span id="profileNote"></span></p>
        </div>

    </div>

    <div id="errorState" class="hidden text-white/50 text-sm">
        <p>Data tidak ditemukan.</p>
    </div>
    <script src="js/aK7mQ2xP9vL4nR8tY1cD6sF3hJ0uW5zB.js"></script>
    <script src="js/Ab7Xq2Nr9Lp4Tv1Ks8Zd6Hm3Yu0Wc5Gj.js"></script>
</body>
</html>
